body{overflow:hidden}
#app{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh * 16 / 7));height:var(--H);transform:translate(-50%,-50%);container-type:size;overflow:hidden;display:flex;flex-direction:column;padding:calc(var(--H) * .015) calc(var(--H) * .025);gap:calc(var(--H) * .012)}
h1{margin:0;font-size:clamp(18px,3.8cqmin,40px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:16px;padding:1.2cqmin 2.2cqmin;font-size:clamp(14px,2.4cqmin,26px);font-weight:700;color:#fff;background:#0369a1;cursor:pointer;font-family:inherit}
.btn.g{background:#16a34a}.btn.o{background:#ea580c}.btn.s{background:#64748b}.btn:disabled{opacity:.4}
.map{position:relative;flex:1;border-radius:28px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.isl{position:absolute;transform:translate(-50%,-50%);width:27%;min-width:140px;border:0;border-radius:50% 46% 52% 48%/55% 50% 50% 45%;padding:3cqmin 2cqmin;color:#fff;text-align:center;cursor:pointer;box-shadow:0 1.2cqmin 0 rgba(0,0,0,.25);font-family:inherit;animation:fl 3s ease-in-out infinite}
.isl.lk{filter:grayscale(1);opacity:.6;animation:none}
@keyframes fl{50%{transform:translate(-50%,-53%)}}
.isl .e{font-size:clamp(34px,9cqmin,90px)}.isl b{display:block;font-size:clamp(15px,3cqmin,32px)}.isl small{display:block;font-size:clamp(11px,2cqmin,20px)}
.card{background:var(--card);border-radius:24px;padding:2.4cqmin 3.4cqmin;flex:1;overflow:auto;box-shadow:0 .8cqmin 2.4cqmin rgba(0,0,0,.15)}
.card h2{margin:0 0 1.2cqmin;font-size:clamp(22px,4.4cqmin,46px)}
.big{font-size:clamp(50px,14cqmin,150px);float:right;margin-left:2cqmin}
.card li{font-size:clamp(16px,3.1cqmin,33px);line-height:1.5;margin:.8cqmin 0;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:8px}.dots i{width:2cqmin;height:2cqmin;min-width:10px;min-height:10px;border-radius:50%;background:var(--mut);opacity:.4}.dots i.on{opacity:1;background:#0369a1}
.lane{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:.4cqmin 1.2cqmin;margin-bottom:.6cqmin}
.lane>b{width:13cqmin;min-width:70px;font-size:clamp(12px,2.1cqmin,22px)}
.trk{position:relative;flex:1;height:5.6cqmin;min-height:32px;border-bottom:4px dashed var(--mut)}
.trk span{position:absolute;bottom:0;font-size:clamp(26px,5.4cqmin,56px);line-height:1;transition:left 1s ease;white-space:nowrap}
.trk span.bonk{animation:bonk 1.3s ease-out both}
@keyframes bonk{0%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-7cqmin) rotate(360deg) scale(1.5)}55%{transform:translateY(-3cqmin) rotate(540deg) scale(1.2)}75%{transform:translateY(0) rotate(700deg) scale(1)}88%{transform:translateY(-1cqmin) rotate(720deg)}100%{transform:translateY(0) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.trk span.bonk{animation:none}}
.trk em{position:absolute;right:0;bottom:2px;font-size:clamp(18px,3.6cqmin,36px);font-style:normal}
.tb{height:1.2cqmin;background:var(--bg);border-radius:9px;overflow:hidden;margin-bottom:1cqmin}.tb i{display:block;height:100%;background:#f59e0b}
.q{font-size:clamp(17px,3.2cqmin,34px);font-weight:700;margin-bottom:1cqmin}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8cqmin}
.opt{background:var(--bg);border-radius:12px;padding:1cqmin 1.4cqmin;font-size:clamp(14px,2.6cqmin,28px)}.opt.ok{background:#16a34a;color:#fff;font-weight:700}
.msg{margin-top:1cqmin;font-size:clamp(15px,2.8cqmin,30px);font-weight:700}
.zs{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqmin}
.z{border:.6cqmin solid;border-radius:18px;overflow:hidden;background:var(--card)}
.z>b{display:block;color:#fff;text-align:center;padding:.4cqmin;font-size:clamp(12px,2cqmin,22px)}
.bs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6cqmin;padding:.8cqmin}
